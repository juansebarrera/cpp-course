name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            configure: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
            config: Debug
          - os: windows-latest
            configure: cmake -B build -DCMAKE_BUILD_TYPE=Debug
            config: Debug
    steps:
      - uses: actions/checkout@v5

      - name: Configurar CMake
        run: ${{ matrix.configure }}

      - name: Compilar
        run: cmake --build build --config ${{ matrix.config }}

      - name: Tests
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
